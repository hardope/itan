# Publishes a release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The command-line downloads for each platform go on the GitHub release
# page (GoReleaser, see .goreleaser.yaml), then the desktop apps and the
# source of the ffmpeg they include; the Docker image goes to
# ghcr.io/hardope/itan.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  downloads:
    name: Downloads
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog comes from the history
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac-app:
    name: Mac app (${{ matrix.arch }})
    needs: downloads # the release they're attached to
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/cache@v6
        with:
          path: dist/ffmpeg-cache
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('packaging/ffmpeg.env') }}
      - run: packaging/macos/build.sh "${GITHUB_REF_NAME#v}" ${{ matrix.arch }} dist
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg
        env:
          GH_TOKEN: ${{ github.token }}

  windows-app:
    name: Windows app
    needs: downloads
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/cache@v6
        with:
          path: dist/ffmpeg-cache
          key: ffmpeg-windows-${{ hashFiles('packaging/ffmpeg.env') }}
      - shell: pwsh
        run: packaging/windows/build.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart("v")) -OutDir dist
      - shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/*-setup.exe
        env:
          GH_TOKEN: ${{ github.token }}

  ffmpeg-source:
    name: ffmpeg source
    needs: downloads
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The apps include ffmpeg, under the GPL: its source goes alongside.
      - run: |
          . packaging/ffmpeg.env
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          gh release upload "$GITHUB_REF_NAME" "ffmpeg-$FFMPEG_VERSION.tar.xz"
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 0.1.0 and 0.1, plus latest for releases that aren't pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
