# Tests on every push and pull request, and checks that the release
# downloads and the Docker image still build, so tagging a release doesn't
# find out first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          go test ./... 2>&1 | tee test.log || {
            # Repeat the failures as annotations: they show on the commit
            # page, where reading them doesn't need the full log.
            grep -E -e '--- FAIL|_test\.go:[0-9]+:|^panic:' test.log | head -10 |
              sed -e 's/%/%25/g' -e 's/^/::error::/'
            exit 1
          }

  release-build:
    name: Release downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # The command for every system, to try before a release.
      - uses: actions/upload-artifact@v7
        with:
          name: itan-command-line
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 14

  mac-app:
    name: Mac app (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/cache@v6
        with:
          path: dist/ffmpeg-cache
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('packaging/ffmpeg.env') }}
      - run: packaging/macos/build.sh "0.0.0-ci.${GITHUB_SHA:0:7}" ${{ matrix.arch }} dist
      # A test build to try before a release (Actions page, signed in).
      - uses: actions/upload-artifact@v7
        with:
          name: itan-macos-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 14

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/cache@v6
        with:
          path: dist/ffmpeg-cache
          key: ffmpeg-windows-${{ hashFiles('packaging/ffmpeg.env') }}
      - shell: pwsh
        run: packaging/windows/build.ps1 -Version "0.0.0-ci.$($env:GITHUB_SHA.Substring(0, 7))" -OutDir dist
      - uses: actions/upload-artifact@v7
        with:
          name: itan-windows-amd64
          path: dist/*-setup.exe
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
