# GoReleaser builds the downloads for a release: one archive per platform
# plus checksums, attached to the GitHub release. It runs when a v* tag is
# pushed (.github/workflows/release.yml). Try it locally with:
#   goreleaser release --snapshot --clean
version: 2

project_name: itan

before:
  hooks:
    # Licenses of what's built in, shipped in each archive (gitignored).
    - sh -c "go run ./packaging/notices ./cmd/itan > THIRD-PARTY.txt"

builds:
  - main: ./cmd/itan
    binary: itan
    env:
      - CGO_ENABLED=0 # pure Go SQLite: static binaries, no C toolchain per platform
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # itan_0.1.0_macos_arm64.tar.gz, itan_0.1.0_linux_armv7.tar.gz, ...
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - THIRD-PARTY.txt

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  abbrev: 7 # newest first, short commit ids

release:
  prerelease: auto
  footer: |
    ## Which download?

    **The app** runs Itan in the background, with an icon in the menu bar (Mac) or next to the clock (Windows). ffmpeg is included.

    | Computer | File |
    |---|---|
    | Mac with Apple Silicon (M1 or later) | `Itan-{{ .Version }}-macos-arm64.dmg` |
    | Mac with an Intel processor | `Itan-{{ .Version }}-macos-amd64.dmg` |
    | Windows 10 or 11 | `Itan-{{ .Version }}-windows-amd64-setup.exe` |

    The apps aren't signed by Apple or Microsoft yet, so the first time needs an extra click: see [Opening the app the first time](https://github.com/hardope/itan#opening-the-app-the-first-time).

    **The command** `itan` is for servers, NAS boxes and Raspberry Pis. Install [ffmpeg](https://ffmpeg.org/download.html) as well.

    | Computer | File |
    |---|---|
    | Linux PC or server | `linux_amd64` |
    | Raspberry Pi 4 or 5, or an ARM NAS, with a 64-bit OS | `linux_arm64` |
    | Raspberry Pi with 32-bit Raspberry Pi OS | `linux_armv7` |
    | Mac, from a terminal | `macos_arm64` (Apple Silicon), `macos_amd64` (Intel) |
    | Windows, from a terminal | `windows_amd64` (`windows_arm64` for Snapdragon laptops) |

    **Docker** (amd64, arm64, armv7; ffmpeg included): `docker pull ghcr.io/hardope/itan:{{ .Version }}`

    The apps include FFmpeg, licensed under the GPL v3; its source code is attached as `ffmpeg-<version>.tar.xz`. See the [README](https://github.com/hardope/itan#readme) to get started.
